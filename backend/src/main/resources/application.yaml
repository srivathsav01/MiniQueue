# Shown at /actuator/info. Render sets RENDER_GIT_COMMIT for every deploy.
info:
  commit: ${RENDER_GIT_COMMIT:local}

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

miniqueue:
  redelivery:
    timeout-minutes: 10
    fixed-delay-ms: 60000
    max-retries: 3
    batch-size: 100
  limits:
    max-payload-bytes: 262144 #256 KB
  security:
    session-ttl: 8h
    # Where the dashboard lives. Sign-in always redirects here and nowhere else.
    dashboard-url: ${MINIQUEUE_DASHBOARD_URL:http://localhost:5173}
    # Comma-separated GitHub usernames that get admin, e.g. srivathsav01
    admins: ${MINIQUEUE_ADMINS:}
    # true: any other GitHub user may sign in read-only. false: only admins may sign in.
    public-viewer: ${MINIQUEUE_PUBLIC_VIEWER:true}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      callback-url: ${GITHUB_CALLBACK_URL:http://localhost:8080/api/v1/auth/github/callback}

spring:
  application:
    name: miniqueue
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/miniqueue}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  info:
    env:
      enabled: true