server {
    listen 80;
    root /usr/share/nginx/html;

    # The REST API, including the GitHub sign-in redirects
    location /api/ {
        proxy_pass http://miniqueue-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://miniqueue-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The React app. Any other path (/manage, /login/callback) is a route inside the app, so
    # nginx must serve index.html and let React Router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}